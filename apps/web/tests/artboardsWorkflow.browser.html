<!doctype html><html><meta charset="UTF-8"><title>Artboard interaction checks</title><div id="root"></div><aside style="position:fixed;z-index:100000;bottom:20px;left:400px;background:#142327;color:#dce4e9;padding:8px;font:12px system-ui;pointer-events:none"><button id="run-artboards" style="pointer-events:auto">Run artboard checks</button><pre id="artboards-result">Ready</pre></aside><script>function fail(message){document.getElementById('artboards-result').textContent='FAIL: '+message;const run=new URLSearchParams(location.search).get('run');if(run)fetch('/__browser_result?run='+encodeURIComponent(run),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'failed',checks:0,message})});}addEventListener('error',e=>fail(e.message));addEventListener('unhandledrejection',e=>fail(String(e.reason)));</script><script type="module" src="./artboardsWorkflow.browser.tsx"></script></html>
