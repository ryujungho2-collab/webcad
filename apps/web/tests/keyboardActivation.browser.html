<!doctype html><html><meta charset="UTF-8"><title>B0-A keyboard activation</title><div id="root"></div><aside style="position:fixed;z-index:100000;bottom:35px;left:450px;pointer-events:none;background:#142327;color:white;padding:8px;font:12px system-ui"><button id="run-activation" style="pointer-events:auto">Run keyboard activation</button><pre id="activation-result">Ready</pre></aside><script>
