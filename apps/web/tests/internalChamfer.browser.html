<!doctype html><html><meta charset="UTF-8"><title>Internal corner chamfer workflow</title><div id="root"></div><aside style="position:fixed;z-index:100000;bottom:35px;left:400px;background:#142327;color:#dce4e9;padding:10px;max-width:750px;font:12px system-ui;pointer-events:none"><button id="run-corner" style="pointer-events:auto">Run internal corner checks</button><pre id="corner-result" role="status">Ready</pre></aside><script>
function reportStartupError(message){document.getElementById('corner-result').textContent='FAIL: '+message;const run=new URLSearchParams(location.search).get('run');if(run)fetch('/__browser_result?run='+encodeURIComponent(run),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'failed',checks:0,message:'Startup: '+message})});}
addEventListener('error',e=>reportStartupError(e.message));addEventListener('unhandledrejection',e=>reportStartupError(String(e.reason)));
</script><script type="module" src="./internalChamfer.browser.tsx"></script></html>
